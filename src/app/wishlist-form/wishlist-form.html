<form class="wishlist-form" [formGroup]="wishlistForm" (ngSubmit)="onSubmit()">

    <div class="wishlist-form-header">
        <p class="eyebrow">Wunschliste</p>
        <h2>Neues Reiseziel hinzugefügen</h2>
    </div>

    <div class="input-group">
        <input formControlName="country" placeholder="Land">
         <input formControlName="city" placeholder="Stadt">
   
    </div>

    <div class="input-group">
        <input formControlName="bestTravelTime" placeholder="beste Reisezeit">
        <input formControlName="priority" type="number" min="1" max="5" placeholder="Priorität (1-5)">
    </div>
 
    <textarea>
        formControlName="notes" placeholder="Notizen">
    </textarea>
    

    <button class="save-button" type="submit">Speichern</button>
</form>
