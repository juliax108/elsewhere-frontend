<!-- Formular ist mit Reactive Form auf trip-form.ts verbunden --> 
<form
    class="trip-form"
    [formGroup]="tripForm"
    (ngSubmit)="onSubmit()">

    <h2>Neue Reise</h2>

    <!-- zweispaltige Gruppe für Reisename und Status -->
    <div class="input-group">
        <input
            formControlName="title"
            placeholder="Reisename">

        <select formControlName="status">
            <option value="geplant">Geplant</option>
            <option value="abgeschlossen">Abgeschlossen</option>
        </select>
    </div>

    <!-- verbindet diesen Bereich mit dem stops-FormArray -->
    <div class="stops-section" formArrayName="stops">

        <!-- für jede Station im FormArray wird ein eigener Formularbereich erzeugt -->
        @for (stop of stops.controls; track $index) {
            <div class="stop-card" [formGroupName]="$index">

                <div class="stop-header">
                    <h3>Station {{ $index + 1 }}</h3>

                    <!-- eine Station kann nur entfernt werden, wenn mehr als eine Station vorhanden ist -->
                    @if (stops.length > 1) {
                        <button
                            class="remove-stop"
                            type="button"
                            (click)="removeStop($index)">
                            Station entfernen
                        </button>
                    }
                </div>

                <!-- Eingabefelder der aktuellen Station -->
                <div class="input-group">
                    <input
                        formControlName="country"
                        placeholder="Land">

                    <input
                        formControlName="city"
                        placeholder="Stadt">
                </div>

            </div>
        }

    </div>

    <!-- fügt dem FormArray eine weitere Station hinzu -->
    <button
        class="add-stop"
        type="button"
        (click)="addStop()">
        + Station hinzufügen
    </button>

    <!-- Reisezeitraum -->
    <div class="input-group">
        <input
            formControlName="startDate"
            type="date">

        <input
            formControlName="endDate"
            type="date">
    </div>

    <!-- weitere Informationen zur Reise -->
    <input
        formControlName="description"
        placeholder="Beschreibung">

    <div class="input-group">
        <input
            formControlName="travelWith"
            placeholder="Mit wem?">

        <select formControlName="transportMode">
            <option value="">Transportmittel</option>
            <option value="Flugzeug">Flugzeug</option>
            <option value="Auto">Auto</option>
            <option value="Bahn">Bahn</option>
            <option value="Bus">Bus</option>
            <option value="Schiff">Schiff</option>
        </select>
    </div>

    <!-- eine Bewertung wird nur bei abgeschlossener Reise angezeigt -->
    @if (tripForm.get('status')?.value === 'abgeschlossen') {
        <input
            formControlName="rating"
            type="number"
            min="1"
            max="5"
            placeholder="Bewertung (1–5)">
    }

    <button
        class="save-button"
        type="submit">
        Speichern
    </button>

</form>
